name: Yayınla

on:
  push:
    branches:
      - main
      - claude/personal-weight-tracking-app-qgayj5
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  kontrol:
    name: Dosya kontrolü
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript sözdizimi
        run: |
          for f in js/*.js sw.js; do
            node --check "$f" || exit 1
          done

      - name: Manifest ve varlıklar
        run: |
          node -e "
            const m = JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'));
            const fs = require('fs');
            for (const i of m.icons) {
              if (!fs.existsSync(i.src)) throw new Error('Eksik simge: ' + i.src);
            }
            const html = fs.readFileSync('index.html','utf8');
            for (const m2 of html.matchAll(/(?:src|href)=\"((?:js|css|icons)\/[^\"]+)\"/g)) {
              if (!fs.existsSync(m2[1])) throw new Error('index.html eksik dosyaya bakıyor: ' + m2[1]);
            }
            console.log('Manifest, simgeler ve index.html bağlantıları tamam.');
          "

      - name: Aranan elemanlar var mı
        run: node scripts/check-ids.js

      - name: Service worker önbelleği eksiksiz mi
        run: |
          node -e "
            const fs = require('fs');
            const sw = fs.readFileSync('sw.js','utf8');
            const listed = [...sw.matchAll(/'\.\/(js\/[^']+|css\/[^']+)'/g)].map(m => m[1]);
            const onDisk = [...fs.readdirSync('js').map(f => 'js/' + f),
                            ...fs.readdirSync('css').map(f => 'css/' + f)];
            const missing = onDisk.filter(f => !listed.includes(f));
            if (missing.length) throw new Error('sw.js önbelleğinde eksik: ' + missing.join(', '));
            console.log('Service worker tüm dosyaları önbelleğe alıyor.');
          "

  yayin:
    name: GitHub Pages
    needs: kontrol
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Siteyi hazirla
        run: |
          npm run icons
          npm run build

      # Pages bu depoda "bir daldan yayinla" olarak kurulu; Actions
      # kaynagi secili olmadigi icin deploy-pages adimi hic calismadan
      # dusuyordu ve site aylardir guncellenmiyordu. Bunun yerine
      # uretilen siteyi dogrudan gh-pages dalina yaziyoruz.
      - name: gh-pages dalina yayinla
        run: |
          cd www
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Yayin: ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
