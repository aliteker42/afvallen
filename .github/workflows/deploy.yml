name: Yayınla

on:
  push:
    branches:
      - main
      - claude/personal-weight-tracking-app-qgayj5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sözdizimi kontrolü
        run: |
          for f in js/*.js sw.js; do
            node --check "$f" || exit 1
          done
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          echo "Tüm dosyalar geçerli."

      # enablement: depo ayarlarında Pages kapalıysa iş akışı kendisi açar
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
