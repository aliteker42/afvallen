name: Sonda

# Gecici: IGMG namaz vakitleri kaynagini kesfetmek icin. Bu ortamdan
# igmg.org'a erisim engelli; GitHub sunucusu erisebiliyor, cikti
# loglardan okunuyor. Kaynak netlesince bu dosya silinecek.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/personal-weight-tracking-app-qgayj5
    paths:
      - '.github/workflows/probe.yml'

jobs:
  ara:
    runs-on: ubuntu-latest
    steps:
      - name: Aday adresleri dene
        run: |
          for u in \
            "https://www.igmg.org/" \
            "https://www.igmg.org/namaz-vakitleri/" \
            "https://namazvakti.igmg.org/" \
            "https://vakit.igmg.org/" \
            "https://www.igmg.org/nl/" \
            "https://www.igmg.nl/" \
            "https://milligorus.nl/"
          do
            code=$(curl -sSL -m 25 -o /tmp/p.html -w "%{http_code}" "$u" 2>/dev/null || echo "000")
            size=$(wc -c < /tmp/p.html 2>/dev/null || echo 0)
            title=$(grep -oiP '(?<=<title>)[^<]{0,120}' /tmp/p.html 2>/dev/null | head -1)
            echo "=== $u  ->  HTTP $code  ${size}B"
            [ -n "$title" ] && echo "    baslik: $title"
            # sayfada namaz/vakit gecen baglantilar
            grep -oiE 'href="[^"]{0,160}(namaz|vakit|gebed|prayer)[^"]{0,160}"' /tmp/p.html 2>/dev/null \
              | sort -u | head -8 | sed 's/^/    bag: /'
            # JSON/API izleri
            grep -oiE '(https?:)?//[a-z0-9.-]+/[^"'"'"' ]{0,120}(api|json|vakit|prayer)[^"'"'"' ]{0,80}' /tmp/p.html 2>/dev/null \
              | sort -u | head -6 | sed 's/^/    api?: /'
            echo
          done
