name: Sonda

# Gecici: IGMG namaz vakitleri kaynagini kesfetmek icin. Bu ortamdan
# igmg.org'a erisim engelli; GitHub sunucusu erisebiliyor, cikti
# loglardan okunuyor. Kaynak netlesince bu dosya silinecek.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/personal-weight-tracking-app-qgayj5
    paths:
      - '.github/workflows/probe.yml'

jobs:
  ara:
    runs-on: ubuntu-latest
    steps:
      - name: Vakit aracini soek
        run: |
          curl -sSL -m 25 -o /tmp/h.html "https://www.igmg.org/" -H 'User-Agent: Mozilla/5.0'

          echo "### prayer-times eklentisinin dosyalari:"
          grep -oiE 'https://www\.igmg\.org/wp-content/plugins/prayer-times/[^"'"'"' )]+' /tmp/h.html | sort -u

          echo; echo "### sayfadaki vakit blogu (prayer gecen 400 karakter):"
          grep -oiE '.{200}prayer-times.{400}' /tmp/h.html | head -3

          echo; echo "### eklentinin JS dosyalari:"
          for j in $(grep -oiE 'https://www\.igmg\.org/wp-content/plugins/prayer-times/[^"'"'"' )]+\.js' /tmp/h.html | sort -u); do
            echo "--- $j"
            curl -sSL -m 20 "$j" -H 'User-Agent: Mozilla/5.0' | head -c 2000
            echo
          done

          echo; echo "### city.php dogrudan (slash olmadan):"
          curl -sSL -m 20 "https://www.igmg.org/wp-content/plugins/prayer-times/city.php?city=Soest" -H 'User-Agent: Mozilla/5.0' | head -c 600
          echo; echo "### city.php parametresiz:"
          curl -sSL -m 20 "https://www.igmg.org/wp-content/plugins/prayer-times/city.php" -H 'User-Agent: Mozilla/5.0' | head -c 600
