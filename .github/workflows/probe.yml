name: Sonda

# Gecici: IGMG namaz vakitleri kaynagini kesfetmek icin. Bu ortamdan
# igmg.org'a erisim engelli; GitHub sunucusu erisebiliyor, cikti
# loglardan okunuyor. Kaynak netlesince bu dosya silinecek.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/personal-weight-tracking-app-qgayj5
    paths:
      - '.github/workflows/probe.yml'

jobs:
  ara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sayfayi gercek tarayiciyla ac
        run: |
          npm i -s playwright@latest
          npx playwright install --with-deps chromium
          cat > p.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const pg = await b.newPage();
            const istekler = [];
            pg.on('request', r => {
              const u = r.url();
              if (/vakit|gebed|prayer|namaz|api|ajax|admin-ajax|json/i.test(u)) istekler.push(r.method() + ' ' + u);
            });
            for (const url of ['https://milligorus.nl/islam/gebedstijden', 'https://igmg.nl/']) {
              console.log('\n######## ' + url);
              try {
                await pg.goto(url, { waitUntil: 'networkidle', timeout: 45000 });
              } catch (e) { console.log('  yuklenemedi: ' + e.message); continue; }
              const govde = await pg.evaluate(() => document.body.innerText);
              // saat gecen satirlari yaz
              const satir = govde.split('\n').map(x => x.trim()).filter(x => /\d{1,2}[:.]\d{2}/.test(x));
              console.log('  saat gecen satirlar (' + satir.length + '):');
              satir.slice(0, 25).forEach(x => console.log('    ' + x.slice(0, 120)));
              const sehir = await pg.evaluate(() =>
                [...document.querySelectorAll('select option')].map(o => o.textContent.trim()).slice(0, 40));
              if (sehir.length) console.log('  sehir secenekleri: ' + sehir.join(', '));
              const soest = await pg.evaluate(() => document.body.innerText.match(/.{60}Soest.{60}/i)?.[0] || '');
              if (soest) console.log('  Soest gecen yer: ' + soest.replace(/\n/g, ' '));
            }
            console.log('\n######## ilgili ag istekleri:');
            [...new Set(istekler)].slice(0, 25).forEach(x => console.log('  ' + x));
            await b.close();
          })();
JS
          node p.js
