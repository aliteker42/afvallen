name: Sonda

# Gecici: IGMG namaz vakitleri kaynagini kesfetmek icin. Bu ortamdan
# igmg.org'a erisim engelli; GitHub sunucusu erisebiliyor, cikti
# loglardan okunuyor. Kaynak netlesince bu dosya silinecek.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/personal-weight-tracking-app-qgayj5
    paths:
      - '.github/workflows/probe.yml'

jobs:
  ara:
    runs-on: ubuntu-latest
    steps:
      - name: IGMG city.php ve gebedstijden
        run: |
          echo "############ 1) igmg.org city.php ############"
          for c in Soest soest Amersfoort Utrecht; do
            echo "--- city=$c"
            curl -sSL -m 25 "https://www.igmg.org/wp-content/plugins/prayer-times/city.php/?city=$c" \
              -H 'User-Agent: Mozilla/5.0' | head -c 1200
            echo; echo
          done

          echo "############ 2) milligorus.nl/islam/gebedstijden ############"
          curl -sSL -m 25 -o /tmp/g.html "https://milligorus.nl/islam/gebedstijden" -H 'User-Agent: Mozilla/5.0'
          echo "boyut: $(wc -c < /tmp/g.html)"
          echo "--- sehir secenekleri:"
          grep -oiE '<option[^>]*>[^<]{0,40}</option>' /tmp/g.html | head -25
          echo "--- Soest gecen satirlar:"
          grep -oiE '.{80}soest.{80}' /tmp/g.html | head -5
          echo "--- saat gibi gorunen ilk esles:"
          grep -oE '[0-2][0-9]:[0-5][0-9]' /tmp/g.html | head -20
          echo "--- iframe/script kaynaklari:"
          grep -oiE '(iframe|script)[^>]*src="[^"]+"' /tmp/g.html | head -12
